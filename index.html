<!DOCTYPE html>
<html>
<head>
  <title>Sign in | ShopNest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <a href="index.html" class="alogo">Shop<span>Nest</span></a>
  <div class="card auth">
    <h2>Sign in</h2>
    <form id="signin" novalidate>
      <label>Email</label>
      <input id="email" type="email">
      <small class="fe" id="e-email"></small>
      <label>Password</label>
      <input id="pw" type="password">
      <small class="fe" id="e-pw"></small>
      <button class="btn y" id="btn">Sign in</button>
    </form>
    <div id="msg"></div>
    <div class="link"><a href="reset.html">Forgot password?</a></div>
    <div class="link">New to ShopNest? <a href="signup.html">Create your account</a></div>
  </div>
</body>
</html>
