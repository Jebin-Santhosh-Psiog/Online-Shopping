name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create env.js from GitHub Secrets
        run: |
          echo "const KEY = \"${{ secrets.FIREBASE_API_KEY }}\";" > js/env.js
          echo "const PID = \"${{ secrets.FIREBASE_PROJECT_ID }}\";" >> js/env.js
          echo "const EJS = { service: \"${{ secrets.EMAILJS_SERVICE_ID }}\", template: \"${{ secrets.EMAILJS_TEMPLATE_ID }}\", key: \"${{ secrets.EMAILJS_PUBLIC_KEY }}\" };" >> js/env.js

      - name: Remove dev-only files
        run: rm -rf test.html .github .htmlhintrc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
