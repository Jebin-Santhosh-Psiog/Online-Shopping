<!DOCTYPE html>
<html>
<head>
  <title>PsiogKart</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/shop.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
</head>
<body>
  <div class="banner" id="banner" style="display:none">
    <h1 id="btitle"></h1>
    <p id="btext"></p>
  </div>

  <div class="sbar">
    <div id="rtitle">Loading products...</div>
    <div>
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="">Featured</option>
        <option value="lo">Price: Low to High</option>
        <option value="hi">Price: High to Low</option>
        <option value="new">Newest Arrivals</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="pager">
    <button class="btn grey" id="prev">Prev</button>
    <span id="pg"></span>
    <button class="btn grey" id="next">Next</button>
  </div>

  <script src="../js/customer/common.js"></script>
  <script src="../js/customer/shop.js"></script>
</body>
</html>
