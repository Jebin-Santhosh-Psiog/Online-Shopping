<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <input id="em" placeholder="email">
  <input id="pw" type="password" placeholder="password">
  <button id="go">Test</button>
  <pre id="out"></pre>

  <script>
    $("#go").click(function () {
      authApi("signInWithPassword", {
        email: $("#em").val(),
        password: $("#pw").val(),
        returnSecureToken: true
      })
      .then(function (r) {
        localStorage.setItem("tok", r.idToken);
        return dbApi("POST", "categories", { name: "Electronics", active: true });
      })
      .then(function () {
        return dbApi("GET", "categories");
      })
      .then(function (r) {
        $("#out").text(JSON.stringify(r, null, 2));
      })
      .fail(function (e) {
        $("#out").text(JSON.stringify(e.responseJSON, null, 2));
      });
    });
  </script>
</body>
</html>
