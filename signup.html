<!DOCTYPE html>
<html>
<head>
  <title>Create account | ShopNest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <a href="index.html" class="alogo">Shop<span>Nest</span></a>
  <div class="card auth">
    <h2>Create account</h2>
    <form id="signup" novalidate>
      <label>Your name</label>
      <input id="name">
      <small class="fe" id="e-name"></small>
      <label>Email</label>
      <input id="email" type="email">
      <small class="fe" id="e-email"></small>
      <label>Mobile number</label>
      <input id="mob" maxlength="10">
      <small class="fe" id="e-mob"></small>
      <label>Password</label>
      <input id="pw" type="password">
      <small class="fe" id="e-pw"></small>
      <label>Confirm password</label>
      <input id="cpw" type="password">
      <small class="fe" id="e-cpw"></small>
      <button class="btn y" id="btn">Create account</button>
    </form>
    <div id="msg"></div>
    <div class="link">Already have an account? <a href="index.html">Sign in</a></div>
  </div>
</body>
</html>
