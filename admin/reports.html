<!DOCTYPE html>
<html>
<head>
  <title>Reports | ShopAdmin</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card noprint">
      <h2>Reports</h2>
      <div class="filters">
        <div class="wide">
          <label>Report</label>
          <select id="type">
            <optgroup label="Customer reports">
              <option value="cust_all">Customers - all details</option>
              <option value="cust_top">Top 10 customers (date range)</option>
              <option value="cust_cash">Cash purchases by customer (date range)</option>
              <option value="cust_credit">Credit purchases by customer (date range)</option>
            </optgroup>
            <optgroup label="Inventory reports">
              <option value="inv_all">Current stock - all items</option>
              <option value="inv_cat">Current stock - category wise</option>
              <option value="inv_high">High stock (more than 100 units)</option>
              <option value="inv_low">Low stock (less than 15 units)</option>
            </optgroup>
            <optgroup label="Sales reports">
              <option value="sales_all">All sales (date range)</option>
              <option value="sales_cat">Category wise sales (date range)</option>
              <option value="sales_cash">Cash sales (date range)</option>
              <option value="sales_credit">Credit sales (date range)</option>
              <option value="sales_top">Top 10 selling items (date range)</option>
              <option value="sales_bottom">Bottom 10 selling items (date range)</option>
            </optgroup>
          </select>
        </div>
        <div class="dt">
          <label>From date</label>
          <input id="from" type="date">
        </div>
        <div class="dt">
          <label>To date</label>
          <input id="to" type="date">
        </div>
        <button class="btn" id="btn">Run report</button>
      </div>
      <div id="msg"></div>
    </div>

    <div class="card" id="out" style="display:none">
      <div class="rhead">
        <div>
          <h2 id="rtitle"></h2>
          <small id="rsub"></small>
        </div>
        <div class="noprint">
          <button class="btn grey sm" id="csv">Export CSV</button>
          <button class="btn grey sm" id="print">Print</button>
        </div>
      </div>
      <div class="kpis" id="rsum"></div>
      <table id="rtab"></table>
    </div>
  </div>

  <script src="../js/admin/reports.js"></script>
</body>
</html>
